# =============================================================================
# PGEA — Nginx: sirve la SPA Vue y reverse-proxy a /api (SAD §6.4.4).
# Único punto de entrada. Centraliza cabeceras de seguridad (RNF-11).
# TLS (Let's Encrypt) se añade en el override de producción.
# =============================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Logs en formato JSON-ish para consistencia operacional
    log_format  main  '$remote_addr - [$time_iso8601] "$request" '
                      '$status $body_bytes_sent trace_id=$upstream_http_x_trace_id '
                      'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml svg+xml;

    upstream pgea_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # ---- Cabeceras de seguridad (RNF-11) -------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS se activa cuando hay TLS (override prod):
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---- API: /api/* -> backend (se elimina el prefijo /api) -----------
        location /api/ {
            proxy_pass         http://pgea_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Propagación de trazabilidad W3C (RNF-03)
            proxy_set_header   traceparent $http_traceparent;
            proxy_pass_request_headers on;
            proxy_read_timeout 60s;
        }

        # ---- /metrics: restringido a la red interna (SAD §6.4.4) -----------
        location = /metrics {
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # red docker interna
            deny all;
            proxy_pass http://pgea_api/metrics;
        }

        # ---- SPA Vue: history mode fallback --------------------------------
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
