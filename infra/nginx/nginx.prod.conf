# =============================================================================
# Nginx PRODUCCIÓN — TLS 1.2+ con Let's Encrypt (RNF-11, ADR-08).
# Reemplaza nginx.conf en el override de prod. Sustituir DOMAIN por el dominio real.
# =============================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml svg+xml;

    upstream pgea_api { server api:8000; }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        # Reto ACME de certbot
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass         http://pgea_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   traceparent $http_traceparent;
        }

        # /metrics nunca expuesto públicamente en prod
        location = /metrics { deny all; }

        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
    }
}
