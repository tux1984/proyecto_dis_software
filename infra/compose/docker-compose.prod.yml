# =============================================================================
# Override de PRODUCCIÓN (AWS Lightsail, rama `main`). ADR-08, RNF-11.
# Imágenes :latest de GHCR; Nginx termina TLS (Let's Encrypt vía certbot).
# Variables esperadas en el .env de la VM: GHCR_OWNER, TAG.
# =============================================================================
services:
  api:
    image: ghcr.io/${GHCR_OWNER}/proyecto_dis_software-api:${TAG:-latest}
    build: !reset null
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    ports:
      - "8000:8000"
    environment:
      ENV: prod

  worker:
    image: ghcr.io/${GHCR_OWNER}/proyecto_dis_software-api:${TAG:-latest}
    build: !reset null
    environment:
      ENV: prod

  frontend:
    image: ghcr.io/${GHCR_OWNER}/proyecto_dis_software-frontend:${TAG:-latest}
    build: !reset null
    ports:
      - "8080:80"

  # En producción Grafana no se expone públicamente (acceso vía túnel SSH).
  grafana:
    ports: !reset []
