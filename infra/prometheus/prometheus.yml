# =============================================================================
# Prometheus — scrape de métricas RED del API cada 15s (SAD §6.4.2, ADR-04).
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: pgea

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pgea-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: pgea-api

  - job_name: pgea-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8001"]
        labels:
          service: pgea-worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
