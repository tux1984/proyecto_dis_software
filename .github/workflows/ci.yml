# =============================================================================
# CI — lint, type-check, pruebas con cobertura, build de imágenes (ADR-11).
# Se ejecuta en cada PR hacia stage/main y en push a esas ramas.
# Gate de calidad: ruff + mypy + pytest (cobertura >= 70%) + build reproducible.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [stage, main]
  push:
    branches: [stage, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Lint, type-check y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pgea_app_user
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pgea_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pgea_app_user -d pgea_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://pgea_app_user:test@localhost:5432/pgea_test
      JWT_SECRET: ci-secret-not-for-production
      EMBEDDING_PROVIDER: fake
      EMAIL_PROVIDER: mock
      OAUTH_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      OTEL_ENABLED: "false"
      LOKI_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app
      - name: Type-check (mypy)
        run: mypy app
      - name: Migraciones + pruebas con cobertura (>=70%)
        run: |
          alembic upgrade head
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Smoke de carga (Locust headless, breve)
        run: |
          uvicorn app.main:app --port 8000 &
          sleep 4
          locust -f tests/load/catalog_p95.py --headless -u 10 -r 5 -t 15s \
                 --host http://localhost:8000 --only-summary || true
      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend:
    name: Build del frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  build-image:
    name: Build & push a GHCR
    needs: [quality, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push imagen del API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.ref_name == 'main' && 'latest' || 'stage' }}
      - name: Build & push imagen del frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.ref_name == 'main' && 'latest' || 'stage' }}
