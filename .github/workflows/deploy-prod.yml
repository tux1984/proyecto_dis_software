# =============================================================================
# Deploy a PRODUCCIÓN (AWS Lightsail) — en push a `main` (ADR-08).
# Mismo flujo que stage sobre la instancia prod; la imagen :latest facilita
# rollbacks manuales. Requiere: LIGHTSAIL_PROD_HOST, LIGHTSAIL_SSH_KEY.
# =============================================================================
name: Deploy Prod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en Lightsail prod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd /opt/pgea
            git fetch origin main && git checkout main && git reset --hard origin/main
            export TAG=sha-${{ github.sha }}
            docker-compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml pull
            docker-compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml up -d
            docker-compose exec -T api alembic upgrade head
            for i in $(seq 1 20); do
              curl -sf http://localhost:8080/api/health/ready && break || sleep 3
            done
            mkdir -p /opt/pgea/backups
            docker-compose exec -T postgres pg_dump -U pgea_app_user pgea > /opt/pgea/backups/post-deploy-$(date +%Y%m%d%H%M).sql
